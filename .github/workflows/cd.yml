name: CD

# main 에 머지되고 CI 가 통과하면 이미지를 만들어 GHCR 에 올리고 VM 에 배포한다.
# 팀원은 PR 을 머지하는 것 외에 할 일이 없다.
#
# push 가 아니라 workflow_run 으로 받는 이유:
# push 로 받으면 CD 와 CI 가 나란히 시작해서 CI 결과를 기다리지 않는다.
# 테스트가 깨진 커밋이 그대로 운영에 올라갈 수 있다.
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]
  # 특정 이미지로 되돌릴 때 쓴다.
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 이미지 태그 (비우면 새로 빌드해서 배포)'
        required: false
        type: string

# 배포가 겹치면 나중 것이 먼저 끝나 이전 버전이 살아남을 수 있다.
# 이미지 빌드와 달리 배포는 취소하지 않고 순서대로 처리한다.
concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # workflow_run 에서 github.sha 는 기본 브랜치의 최신 커밋이라
  # CI 를 통과한 그 커밋과 다를 수 있다. 항상 검증된 커밋을 명시적으로 쓴다.
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # 이미지 빌드 · 푸시 — VM 설정과 무관하게 항상 동작한다.
  # ---------------------------------------------------------------------------
  image:
    name: 이미지 빌드 · 푸시
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # CI 가 통과한 커밋만 이미지로 만든다.
    # 롤백(image_tag 지정)은 이미 있는 이미지를 쓰므로 빌드하지 않는다.
    # 여기서 빌드하면 latest 가 되돌리려는 버전이 아니라 최신 main 을 가리키게 된다.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.image_tag == '')
      || github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: 체크아웃
        uses: actions/checkout@v5
        with:
          # workflow_run 은 기본적으로 기본 브랜치 최신을 받는다. 검증된 커밋으로 고정한다.
          ref: ${{ env.TARGET_SHA }}

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 소문자로 맞춘다. 저장소 이름에 대문자가 있으면 docker 가 태그를 거부한다.
      - name: 이미지 태그 결정
        id: tag
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "value=$IMAGE:sha-${{ env.TARGET_SHA }}" >> $GITHUB_OUTPUT

      - name: 빌드 · 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 배포 대상 VM 이 x86_64 다. 명시하지 않으면 러너 아키텍처를 따라가는데,
          # 러너가 바뀌거나 누가 로컬(Apple Silicon)에서 빌드해 올리면
          # 컨테이너가 exec format error 로 재시작만 반복한다.
          platforms: linux/amd64
          tags: |
            ${{ steps.tag.outputs.image }}:sha-${{ env.TARGET_SHA }}
            ${{ steps.tag.outputs.image }}:latest
          # 다음 빌드에서 의존성 레이어를 재사용한다. 없으면 매번 Gradle 을 처음부터 돌린다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 요약
        run: |
          echo "### 이미지 푸시 완료" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tag.outputs.value }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # 배포 게이트 상태를 남긴다.
          #
          # 배포 job 의 if 조건이 거짓이면 job 이 그냥 skip 되고 이유가 어디에도 남지 않는다.
          # 가장 흔한 원인은 변수를 Environment 에 넣은 경우다. job 조건은 environment 가
          # 붙기 전에 평가되므로 Environment 변수는 여기서 읽히지 않는다.
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ vars.VM_DEPLOY_ENABLED }}" = "true" ]; then
            echo "**배포: 켜짐** — 이어서 VM 배포가 실행됩니다." >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "**배포: 꺼짐** — 이미지만 만들고 VM 은 건드리지 않습니다."
              echo ""
              echo "| 변수 | 읽힌 값 |"
              echo "|---|---|"
              echo "| \`VM_DEPLOY_ENABLED\` | \`${{ vars.VM_DEPLOY_ENABLED }}\` |"
              echo "| \`VM_HOST\` | \`${{ vars.VM_HOST }}\` |"
              echo "| \`VM_USER\` | \`${{ vars.VM_USER }}\` |"
              echo "| \`HEALTHCHECK_URL\` | \`${{ vars.HEALTHCHECK_URL }}\` |"
              echo ""
              echo "값이 비어 있으면 **Repository variables** 가 아니라"
              echo "Environment variables 에 등록됐을 가능성이 큽니다."
              echo "Settings → Secrets and variables → Actions → Variables 탭 위쪽 영역입니다."
            } >> $GITHUB_STEP_SUMMARY
          fi

  # ---------------------------------------------------------------------------
  # VM 배포 — VM_DEPLOY_ENABLED 변수가 true 일 때만 동작한다.
  #
  # 활성화 방법 (VM 세팅이 끝난 뒤)
  #   Settings > Secrets and variables > Actions
  #     Variables : VM_DEPLOY_ENABLED = true
  #                 VM_HOST           = 40.82.154.5
  #                 VM_USER           = azureuser
  #                 HEALTHCHECK_URL   = https://{도메인}/actuator/health
  #                 VM_SSH_HOST_KEY   = ssh-keyscan 으로 미리 받아둔 호스트 키 (권장)
  #     Secrets   : VM_SSH_KEY        = pem 파일 내용 전체
  #
  # 자세한 절차는 docs/DEPLOYMENT.md 참조.
  # ---------------------------------------------------------------------------
  deploy:
    name: VM 배포
    needs: image
    # image 를 건너뛴 롤백에서도 배포는 이어져야 하므로 always() 로 받고 조건을 직접 쓴다.
    #
    # VM_DEPLOY_ENABLED 는 일부러 여기 넣지 않는다.
    # job 조건이 거짓이면 GitHub 은 job 을 skip 시키고 아무 이유도 남기지 않아서,
    # 배포가 왜 안 됐는지 알 방법이 없다. 실제로 이것 때문에 세 번을 헤맸다.
    # 설정 확인은 아래 첫 스텝에서 값을 찍어가며 한다.
    #
    # ⚠️ 모든 줄의 들여쓰기를 똑같이 맞춘다. `>-` 는 더 깊이 들여쓴 줄을 접지 않고
    # 줄바꿈을 그대로 남기는데, 그러면 조건식이 여러 줄짜리 문자열로 전달돼
    # 조용히 거짓이 되고 배포가 skip 된다.
    if: >-
      always()
      && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
      && (needs.image.result == 'success' || (needs.image.result == 'skipped' && inputs.image_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: production
      url: ${{ vars.HEALTHCHECK_URL }}

    permissions:
      contents: read
      packages: read

    steps:
      # 무엇이 읽혔는지 먼저 남긴다. 값이 비어 있으면 그게 원인이다.
      # 시크릿은 값을 찍지 않고 있는지만 본다 (GitHub 이 마스킹하지만 로그에 남길 이유가 없다).
      - name: 배포 설정 확인
        id: gate
        run: |
          echo "VM_DEPLOY_ENABLED = '${{ vars.VM_DEPLOY_ENABLED }}'"
          echo "VM_HOST           = '${{ vars.VM_HOST }}'"
          echo "VM_USER           = '${{ vars.VM_USER }}'"
          echo "HEALTHCHECK_URL   = '${{ vars.HEALTHCHECK_URL }}'"
          echo "VM_SSH_HOST_KEY   = ${{ vars.VM_SSH_HOST_KEY != '' && '설정됨' || '비어 있음' }}"
          echo "VM_SSH_KEY(시크릿) = ${{ secrets.VM_SSH_KEY != '' && '설정됨' || '비어 있음' }}"

          # vars 가 전부 비었을 때 어디에 등록됐는지 좁힌다.
          # 같은 화면에 Variables 탭과 Secrets 탭이 나란히 있어 섞어 넣기 쉽다.
          if [ -z "${{ vars.VM_DEPLOY_ENABLED }}${{ vars.VM_HOST }}${{ vars.VM_USER }}" ]; then
            echo "--- vars 가 전부 비어 있어 시크릿 쪽을 확인합니다 ---"
            echo "secrets.VM_DEPLOY_ENABLED = ${{ secrets.VM_DEPLOY_ENABLED != '' && '있음' || '없음' }}"
            echo "secrets.VM_HOST           = ${{ secrets.VM_HOST != '' && '있음' || '없음' }}"
            echo "secrets.VM_USER           = ${{ secrets.VM_USER != '' && '있음' || '없음' }}"
            echo "secrets.HEALTHCHECK_URL   = ${{ secrets.HEALTHCHECK_URL != '' && '있음' || '없음' }}"
            {
              echo "### 배포 변수를 찾지 못했습니다"
              echo ""
              echo "| 이름 | Variables | Secrets |"
              echo "|---|---|---|"
              echo "| VM_DEPLOY_ENABLED | 비어 있음 | ${{ secrets.VM_DEPLOY_ENABLED != '' && '**있음**' || '없음' }} |"
              echo "| VM_HOST | 비어 있음 | ${{ secrets.VM_HOST != '' && '**있음**' || '없음' }} |"
              echo "| VM_USER | 비어 있음 | ${{ secrets.VM_USER != '' && '**있음**' || '없음' }} |"
              echo "| HEALTHCHECK_URL | 비어 있음 | ${{ secrets.HEALTHCHECK_URL != '' && '**있음**' || '없음' }} |"
              echo ""
              echo "Secrets 쪽이 **있음** 이면 Variables 탭으로 다시 등록하면 됩니다."
              echo "양쪽 다 없으면 저장소가 아니라 조직(Organization) 설정에 등록됐거나,"
              echo "입력 후 저장 버튼을 누르지 않은 것입니다."
              echo ""
              echo "등록 위치: https://github.com/${{ github.repository }}/settings/variables/actions"
            } >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ vars.VM_DEPLOY_ENABLED }}" != "true" ]; then
            echo "::warning::VM_DEPLOY_ENABLED 가 'true' 가 아니라 배포를 건너뜁니다. 이미지는 GHCR 에 올라가 있습니다."
            echo "배포를 켜려면 Settings → Secrets and variables → Actions → **Repository variables** 에 VM_DEPLOY_ENABLED=true 를 등록하세요." >> $GITHUB_STEP_SUMMARY
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          for v in VM_HOST VM_USER HEALTHCHECK_URL; do
            case "$v" in
              VM_HOST) val="${{ vars.VM_HOST }}" ;;
              VM_USER) val="${{ vars.VM_USER }}" ;;
              HEALTHCHECK_URL) val="${{ vars.HEALTHCHECK_URL }}" ;;
            esac
            if [ -z "$val" ]; then
              echo "::error::$v 가 비어 있습니다. Repository variables 를 확인하세요."
              exit 1
            fi
          done

          echo "proceed=true" >> $GITHUB_OUTPUT

      - name: 체크아웃
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: SSH 키 준비
        if: steps.gate.outputs.proceed == 'true'
        run: |
          mkdir -p ~/.ssh
          # printf 로 끝 개행을 보장한다. 개행이 없으면 ssh 가 키를 invalid format 으로 거부한다.
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 접속 직전에 ssh-keyscan 으로 받은 키를 그대로 믿으면 서버 신원을 확인할 수 없다.
          # 중간자가 끼면 compose 파일과 GHCR 토큰을 공격자 서버에 넘겨주게 된다.
          # 미리 확인한 호스트 키를 등록해 두면 그 경로가 막힌다.
          if [ -n "${{ vars.VM_SSH_HOST_KEY }}" ]; then
            printf '%s\n' "${{ vars.VM_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          else
            echo "::warning::VM_SSH_HOST_KEY 가 없어 첫 접속 키를 그대로 신뢰합니다. docs/DEPLOYMENT.md 를 참고해 등록하세요."
            ssh-keyscan -H "${{ vars.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          # 키가 실제로 읽히는지 먼저 확인한다. 배포 중간에 실패하면 원인 파악이 어렵다.
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "::error::VM_SSH_KEY 를 읽을 수 없습니다. pem 전체를 그대로 넣었는지 확인하세요."; exit 1; }

      # compose 파일도 함께 배포한다. 구성이 바뀌면 VM 에 수동으로 반영할 필요가 없다.
      - name: compose 파일 전송
        if: steps.gate.outputs.proceed == 'true'
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.yml \
            "${{ vars.VM_USER }}@${{ vars.VM_HOST }}:/opt/getit/docker-compose.yml"

      - name: 이미지 교체 · 재시작
        if: steps.gate.outputs.proceed == 'true'
        env:
          IMAGE_TAG: ${{ inputs.image_tag || needs.image.outputs.tag }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" \
            "APP_IMAGE='$IMAGE_TAG' \
             GHCR_USER='${{ github.actor }}' \
             GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
             bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/getit

          # 이미지를 당길 때만 로그인한다. VM 에 장기 자격증명을 남기지 않는다.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # 배포할 이미지를 .env 에 기록한다. 수동 재시작 시에도 같은 버전이 뜬다.
          if grep -q '^APP_IMAGE=' .env; then
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$APP_IMAGE|" .env
          else
            echo "APP_IMAGE=$APP_IMAGE" >> .env
          fi

          echo "▸ 배포 이미지: $APP_IMAGE"
          docker compose pull app
          docker compose up -d --remove-orphans

          # 오래된 이미지가 쌓이면 디스크가 찬다. 29GB 인데 이미지 하나가 600MB 다.
          #
          # -a 가 있어야 한다. 없으면 태그 없는(dangling) 이미지만 지우는데,
          # 배포 이미지에는 전부 sha-* 태그가 붙어 있어 하나도 정리되지 않는다.
          # 실행 중인 컨테이너가 쓰는 이미지는 -a 로도 지워지지 않는다.
          docker image prune -af --filter "until=168h" >/dev/null 2>&1 || true

          docker logout ghcr.io >/dev/null 2>&1 || true
          docker compose ps
          REMOTE

      # 컨테이너가 떴다고 애플리케이션이 뜬 것은 아니다.
      # Flyway 마이그레이션과 JVM 기동에 시간이 걸린다.
      - name: 헬스체크
        if: steps.gate.outputs.proceed == 'true'
        run: |
          URL="${{ vars.HEALTHCHECK_URL }}"
          echo "확인 대상: $URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "정상 기동 확인 (${i}회차)"
              exit 0
            fi
            echo "  ${i}/30 — HTTP $CODE, 10초 후 재시도"
            sleep 10
          done
          echo "::error::5분 안에 헬스체크가 통과하지 못했습니다."
          echo "::error::VM 에서 'docker compose logs app --tail 100' 으로 원인을 확인하세요."
          exit 1

      - name: 실패 시 로그 수집
        if: failure() && steps.gate.outputs.proceed == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" \
            'cd /opt/getit && docker compose logs app --tail 100' || true

      - name: SSH 키 삭제
        if: always()
        run: rm -f ~/.ssh/deploy_key

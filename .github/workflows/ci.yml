name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 같은 브랜치에 연속 push 하면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: temurin

jobs:
  # ---------------------------------------------------------------------------
  # 정적 검사 — DB 도 빌드도 필요 없는 것만 모았다. 가장 먼저 끝나므로 피드백이 빠르다.
  # ---------------------------------------------------------------------------
  verify:
    name: 정적 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: 자격증명 커밋 여부 확인
        run: |
          FOUND=0
          for f in .env src/main/resources/application-secret.yml; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error file=$f::$f 가 커밋돼 있습니다. 자격증명은 커밋하지 않습니다."
              FOUND=1
            fi
          done
          [ "$FOUND" -eq 0 ] && echo "자격증명 미커밋 확인 완료"
          exit $FOUND

      - name: JDK 설치
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      # build.gradle 에 spotless { java { enforceCheck = false } } 를 두었으므로
      # ./gradlew build 는 포맷을 검사하지 않는다. 여기서만 강제한다.
      - name: 포맷 검사
        run: ./gradlew spotlessCheck --stacktrace

      - name: 포맷 위반 안내
        if: failure()
        run: |
          echo "::error::코드 포맷 규칙 위반입니다."
          echo "::error::로컬에서 아래 명령을 실행한 뒤 다시 push 하세요."
          echo "::error::  ./gradlew spotlessApply"

  # ---------------------------------------------------------------------------
  # 빌드 · 테스트 — H2 를 쓰므로 MySQL · Redis 컨테이너가 필요 없다.
  # ---------------------------------------------------------------------------
  build:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 설치
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드 및 테스트
        run: ./gradlew build --stacktrace

      - name: 테스트 리포트 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 스키마 검증 — 빈 MySQL 에 마이그레이션을 돌리고 ddl-auto: validate 로 엔티티와 대조한다.
  # 엔티티만 바꾸고 마이그레이션을 빼먹으면 여기서 잡힌다. H2 로는 검증할 수 없다.
  # ---------------------------------------------------------------------------
  schema:
    name: 스키마 검증
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: getit_schema_test
          MYSQL_USER: getit
          MYSQL_PASSWORD: ci-getit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 설치
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 마이그레이션 ↔ 엔티티 검증
        env:
          SCHEMA_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/getit_schema_test?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          SCHEMA_TEST_DB_USERNAME: getit
          SCHEMA_TEST_DB_PASSWORD: ci-getit
        run: ./gradlew schemaTest --stacktrace

      - name: 검증 리포트 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: schema-report
          path: build/reports/tests/schemaTest
          retention-days: 7
          if-no-files-found: ignore

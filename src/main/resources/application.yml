spring:
  application:
    name: getit
  profiles:
    default: local


  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
    # null 을 전역으로 생략하지 않는다. 명세서가 null 자체를 의미 있는 값으로 쓴다.
    # (totalScore: null → "미평가", answerText: null → "답변 없음", mySubmission: null → 미제출)
    default-property-inclusion: always

  # 스키마는 dev · prod 에서만 마이그레이션으로 관리한다.
  # local 은 ddl-auto: update 로 두어 엔티티 설계 중 반복 속도를 유지한다.
  flyway:
    enabled: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  security:
    oauth2:
      client:
        registration:
          google:
            # 값은 .env 에서 주입한다. 커밋 금지.
            # 미설정 상태에서도 기동은 되어야 한다 (Google 설정이 없는 팀원의 로컬 개발).
            # 실제 로그인을 시도할 때만 실패한다.
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            # openid 를 빼면 OIDC 가 아닌 일반 OAuth2 로 동작해
            # OidcUserService 대신 CustomOAuth2UserService 가 호출된다.
            scope:
              - profile
              - email

# 헬스체크만 노출한다. env · beans · metrics 까지 열면 내부 구조가 그대로 드러난다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # Redis 는 아직 코드에서 쓰지 않는다. 켜두면 붙을 곳이 없어 헬스체크가 DOWN 이 된다.
    redis:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  default-produces-media-type: application/json

server:
  port: 8080
  # nginx 뒤에서 동작한다. 이 설정이 없으면 Spring 이 프록시의 X-Forwarded-* 를 무시하고
  # 자기 커넥터 기준(http, 8080)으로 절대 URL 을 만든다.
  #
  # 그 결과 OAuth2 redirect_uri 가 http 로 나가 Google 이 redirect_uri_mismatch 로 거부한다.
  # 로컬(프록시 없음)에서는 X-Forwarded-* 자체가 없으므로 영향이 없다.
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      force: true

getit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  jwt:
    # 시크릿은 커밋하지 않는다. .env 의 JWT_SECRET 에서 주입받는다.
    secret: ${JWT_SECRET}
    access-token-validity: 30m
    refresh-token-validity: 14d

  file:
    local:
      # 업로드 파일을 저장할 경로. LocalFileWebConfig 가 이 경로를
      # /api/public/files/** 로 서빙한다.
      path: ${FILE_LOCAL_PATH:./uploads}
      # 업로드 결과로 내려줄 URL 의 앞부분. 위 서빙 경로와 반드시 일치해야 한다.
      base-url: ${FILE_BASE_URL:http://localhost:8080/api/public/files}

  auth:
    # 로그인 성공 후 사용자를 돌려보낼 프론트 주소
    oauth2-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}
    # 로컬은 http 라 false. dev · prod 에서 true 로 덮어쓴다
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    # 프론트와 백엔드가 같은 등록 도메인이면 Lax (예: getit.co.kr ↔ api.getit.co.kr).
    # 서로 다른 사이트면 None 이어야 재발급 요청에 쿠키가 실린다. None 은 Secure=true 필수.
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

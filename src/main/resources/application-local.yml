# 로컬 개발용. 자격증명은 커밋하지 않고 .env 에서 읽는다.
#   cp .env.example .env && docker compose up -d
spring:
  # [.properties] 는 확장자 없는 .env 를 properties 형식으로 파싱하라는 뜻이다.
  # optional: 을 붙이지 않는다. .env 가 없으면 파일명을 알려주며 즉시 실패하는 편이
  # "Access denied for user '${DB_USERNAME}'" 같은 메시지보다 원인을 찾기 쉽다.
  # dev · prod 는 실제 환경변수를 쓰므로 이 import 가 없다.
  config:
    import: file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:getit}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    # 기본값을 두지 않는다. .env 가 없으면 기동 단계에서 바로 실패해야 한다.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


logging:
  level:
    com.getit: debug
    org.hibernate.orm.jdbc.bind: trace

# 운영 환경. 스키마 변경은 마이그레이션으로만 반영하므로 ddl-auto 는 validate 로 고정한다.
spring:
  # 스키마 변경은 마이그레이션으로만 반영한다. ddl-auto 는 validate 로 고정.
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 번호가 낮은 마이그레이션이 뒤늦게 들어와도 적용한다.
    #
    # 여러 사람이 각자 브랜치에서 번호를 매기면 머지 순서가 번호 순서와 어긋난다.
    # 실제로 V19 → V22 가 먼저 적용된 뒤 V20 · V21 이 머지돼 운영이 내려갔다.
    # 이 설정이 없으면 Flyway 가 "resolved migration not applied" 로 기동을 거부한다.
    #
    # 대신 마이그레이션끼리 순서에 의존하지 않게 작성해야 한다.
    # 앞선 마이그레이션이 만든 테이블을 전제하는 변경은 같은 PR 안에 함께 둔다.
    out-of-order: true

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

getit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: info
    com.getit: info

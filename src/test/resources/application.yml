# 테스트는 외부 인프라(MySQL · Redis) 없이 돌아야 한다. CI 에서도 그대로 사용한다.
spring:
  # 마이그레이션은 MySQL 전용 DDL 이라 H2 에서 돌면 깨진다.
  # 스키마 검증은 schemaTest 가 실제 MySQL 로 따로 수행한다.
  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:getit;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

  # oauth2Login 은 ClientRegistrationRepository 빈을 요구한다.
  # 등록이 하나도 없으면 빈이 만들어지지 않아 컨텍스트 로딩이 실패한다.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - profile
              - email

getit:
  cors:
    allowed-origins:
      - http://localhost:3000

  jwt:
    # 테스트 전용 고정 키. 실제 시크릿이 아니므로 커밋해도 무방하다 (HS256 최소 32바이트)
    secret: test-secret-key-for-getit-authentication-only-do-not-use-in-production
    access-token-validity: 30m
    refresh-token-validity: 14d

  file:
    # 테스트는 Azure 를 쓰지 않는다. 값이 없으면 FileService 가 뜨지 않으므로 채워만 둔다.
    # 이 파일은 메인 application.yml 을 통째로 가린다.
    azure:
      enabled: false
      account: ""
      container: uploads
      upload-url-ttl: PT10M
      download-url-ttl: PT5M
      delegation-key-ttl: PT6H
    local:
      # 저장소를 더럽히지 않도록 임시 디렉터리를 쓴다.
      path: ${java.io.tmpdir}/getit-test-uploads
      base-url: http://localhost:8080/api/public/files

  auth:
    oauth2-redirect-uri: http://localhost:5173/oauth/callback
    refresh-cookie-secure: false
    refresh-cookie-same-site: Lax

logging:
  level:
    root: warn
    com.getit: info

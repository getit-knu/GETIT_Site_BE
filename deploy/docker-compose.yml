# VM 운영용 구성. CD 워크플로가 이 파일을 VM 의 /opt/getit 으로 복사한 뒤 실행한다.
#
# 값은 같은 디렉터리의 .env 에서 읽는다. .env 는 VM 에만 있고 저장소에 없다.
# TLS 종료와 도메인 라우팅은 호스트의 nginx 가 담당한다. 여기서는 8080 만 로컬에 연다.

services:
  mysql:
    image: mysql:8.4
    container_name: getit-mysql
    restart: unless-stopped
    # 외부에 노출하지 않는다. 같은 compose 네트워크 안에서만 접근한다.
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 가 .env 에 없습니다}
      MYSQL_DATABASE: ${DB_NAME:-getit}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME 이 .env 에 없습니다}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 .env 에 없습니다}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    # 앱과 같은 제한을 건다. 걸지 않으면 경고가 반복될 때 로그가 무한정 커져
    # 29GB 디스크를 채운다. DB 가 죽으면 서비스 전체가 죽는다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    image: ${APP_IMAGE:-ghcr.io/getit-knu/getit_site_be:latest}
    container_name: getit-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # 127.0.0.1 에만 바인딩한다. 0.0.0.0 이면 nginx 를 우회해 http 로 직접 접근할 수 있다.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-getit}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 이 .env 에 없습니다}
      # 빈 문자열을 넘기면 Spring Security 가 "Client id must not be empty" 로 기동에 실패한다.
      # 값이 없을 때는 애플리케이션의 기본값(not-configured)이 쓰이도록 자리표시자를 넣는다.
      # Google 설정 전에도 서버는 떠야 한다. 로그인만 안 될 뿐이다.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-Lax}

      # 업로드 파일은 호스트 볼륨에 남는다. 컨테이너를 지워도 유지된다.
      FILE_LOCAL_PATH: /data/uploads
      FILE_BASE_URL: ${FILE_BASE_URL}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Flyway 마이그레이션 + JVM 기동 시간을 감안한다. 짧으면 정상 기동 중에 unhealthy 로 본다.
      start_period: 90s
    logging:
      driver: json-file
      options:
        # 로그가 디스크를 채워 서버가 멈추는 일이 흔하다.
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
  uploads:
